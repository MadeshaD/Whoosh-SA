[General]
; Enable the plugin. The reload key remains active when disabled.
Enabled=1
; Windows virtual-key code (decimal). 119 = F8, 120 = F9 (default).
ReloadKey=120
; Write configuration and runtime status to Whoosh.SA.log next to the ASI.
Logging=0

[Whoosh]
; Overall volume in percent, scaled by the game's sound effects volume.
VolumePercent=80
; Vehicle speed in km/h at the start and top of the pass-by volume curve.
MinSpeedKmh=64.8
FullVolumeSpeedKmh=162
; Maximum lateral distance to a roadside surface in metres (1.5-15).
PassDistance=10
; Maximum ceiling height above the tunnel probe in metres (3-35).
TunnelRoofHeight=22

[WindAudio]
; Enable speed-dependent driving wind and set its relative level (0-100%).
WindEnabled=1
WindVolumePercent=25

[Camera]
; 0 = GTA, 1 = Most Wanted, 2 = Carbon. Covers three chase views and the bumper.
CameraProfile=2
; Use the roof pivot in all three chase views of either NFS profile (0/1).
CameraRoofAnchor=0
; Eye height offset in metres (-5 to 10). Positive raises the eye above its orbit.
CameraRoofHeight=-0.8
; Chase distance offset in metres (-5 to 20). Positive moves the eye farther away.
CameraRoofDistance=1.0
; Additional viewing pitch in degrees (-45 to 45). Negative looks down, positive up.
; Requires CameraRoofAnchor=1. Height moves the camera vertically with the same viewing angle.
CameraRoofPitch=0.0
; Apply the selected profile to each additional vehicle type (0/1).
CameraBoats=1
CameraMotorcycles=1
CameraPlanes=1
CameraHelicopters=1
CameraTrains=0
; Seconds after mouse look before recentering while moving (0-10).
CameraReturnTimeout=1.0
; Recenter rate (0.5-5). Higher values return faster.
CameraReturnSpeed=2.0
; Field-of-view multiplier (0.65-1.50).
CameraFOVFactor=1.0
; Enable Carbon HUD shake on impacts and rough roads (0/1).
HUDShake=1

[MotionBlur]
; Speed blur including nitrous. 0 = off, 1 = Most Wanted, 2 = Carbon.
MotionBlur=2
; Blur strength in percent (0-150).
MotionBlurStrength=50

[Trails]
; Enable wind streaks behind the vehicle.
WindTrails=1
; Opacity relative to the original streaks (0-200%). 0 hides them, 100 is original.
WindTrailOpacityPercent=150
; Vehicle speed at which wind streaks start, in km/h (18-450).
WindTrailSpeedKmh=120
; Show short trails from lit rear running lights while nitrous is active.
NitroLightTrails=1
; Show speed-sensitive streaks from streetlights and traffic signals.
StreakFlares=1
